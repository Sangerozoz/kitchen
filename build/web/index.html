<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>来割草 不烧心</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #16301b;
			color: #eefbe8;
			font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
			touch-action: none;
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			touch-action: none;
		}
		#canvas:focus { outline: none; }
		#status {
			position: fixed;
			inset: 0;
			background: radial-gradient(circle at 50% 35%, #234d28, #122616);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 24px;
			box-sizing: border-box;
			z-index: 10;
		}
		.title {
			font-size: 28px;
			font-weight: 700;
			color: #ffef6b;
			margin-bottom: 10px;
			text-shadow: 0 2px 8px rgba(0,0,0,0.45);
		}
		.subtitle {
			font-size: 14px;
			color: #c2f0b8;
			margin-bottom: 24px;
		}
		.bar-wrap {
			width: 78%;
			max-width: 300px;
			height: 14px;
			background: rgba(0,0,0,0.38);
			border: 2px solid rgba(132,224,96,0.55);
			border-radius: 999px;
			overflow: hidden;
		}
		#bar-fill {
			width: 2%;
			height: 100%;
			background: linear-gradient(90deg, #4cd950, #ffe047);
			border-radius: 999px;
			transition: width 0.15s ease-out;
		}
		#status-text {
			margin-top: 14px;
			font-size: 14px;
			color: #dff7d8;
			text-align: center;
		}
		#status-notice {
			display: none;
			margin-top: 18px;
			max-width: 90%;
			padding: 12px 16px;
			border-radius: 12px;
			background: rgba(120, 28, 28, 0.9);
			border: 1px solid rgba(255, 130, 120, 0.7);
			color: #ffe8e6;
			font-size: 13px;
			line-height: 1.5;
			word-break: break-word;
			text-align: left;
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">您的浏览器不支持 WebGL2 Canvas。</canvas>
	<div id="status">
		<div class="title">来割草 不烧心</div>
		<div class="subtitle">移动端竖屏割草挑战</div>
		<div class="bar-wrap"><div id="bar-fill"></div></div>
		<div id="status-text">正在连接并加载游戏资源...</div>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>
	<script>
	(function () {
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3003896,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		const statusOverlay = document.getElementById('status');
		const barFill = document.getElementById('bar-fill');
		const statusText = document.getElementById('status-text');
		const statusNotice = document.getElementById('status-notice');

		function showError(msg) {
			statusNotice.style.display = 'block';
			statusNotice.textContent = String(msg);
			statusText.textContent = '加载遇到问题';
		}

		window.addEventListener('error', function (e) {
			showError('JS Error: ' + (e.message || e.error));
		});
		window.addEventListener('unhandledrejection', function (e) {
			showError('Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
		});

		const engine = new Engine(GODOT_CONFIG);
		const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length !== 0) {
			showError('浏览器缺少运行所需特性：\n' + missing.join('\n'));
			return;
		}

		engine.startGame({
			onProgress: function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					barFill.style.width = Math.max(4, pct) + '%';
					const curMB = (current / 1048576).toFixed(1);
					const totMB = (total / 1048576).toFixed(1);
					if (pct >= 100) {
						statusText.textContent = '下载完成，正在启动游戏引擎...';
					} else {
						statusText.textContent = '正在加载游戏 ' + pct + '% (' + curMB + ' / ' + totMB + ' MB)';
					}
				} else {
					statusText.textContent = '正在初始化 WebGL2 与引擎...';
				}
			}
		}).then(function () {
			statusOverlay.remove();
		}).catch(function (err) {
			showError(err && err.message ? err.message : err);
		});
	}());
	</script>
</body>
</html>
