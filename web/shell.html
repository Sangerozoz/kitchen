<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>来割草 不烧心</title>
	<link rel="icon" type="image/png" href="app_icon.png">
	<link rel="apple-touch-icon" href="app_icon.png">
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #67c934;
			color: #3d2206;
			font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
			touch-action: none;
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			touch-action: none;
		}
		#canvas:focus { outline: none; }

		/* Unified Loading + Live-Meadow Home Splash: logo locked pixel-exact to Godot's Home overlay! */
		#status {
			position: fixed;
			inset: 0;
			background:
				radial-gradient(circle at 50% 48%, rgba(255, 250, 200, 0.16) 0%, rgba(24, 72, 14, 0.18) 100%),
				repeating-linear-gradient(90deg, #4db526 0px, #4db526 48px, #57c02f 48px, #57c02f 96px);
			z-index: 10;
			transition: opacity 0.24s ease-out;
		}
		#status.fade-out {
			opacity: 0;
			pointer-events: none;
		}
		#status.fade-out #load-slot {
			opacity: 0;
			transform: scale(0.94);
			transition: opacity 0.14s ease-out, transform 0.14s ease-out;
		}
		#splash-logo {
			position: fixed;
			left: 8%;
			width: 84%;
			top: 2.5%;
			height: 24%;
			object-fit: contain;
			pointer-events: none;
		}
		/* Loading bar sits neatly at the lower drag-cue slot */
		#load-slot {
			position: fixed;
			left: 14%;
			width: 72%;
			top: 78%;
			height: 6.4%;
			min-height: 44px;
			max-height: 60px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}
		.bar-shell {
			position: relative;
			width: 100%;
			height: 100%;
			background: rgba(255, 248, 224, 0.94);
			border: 4px solid #4a2807;
			border-radius: 999px;
			box-shadow: 0 5px 0 #c86c00, 0 8px 16px rgba(24, 56, 8, 0.30);
			overflow: hidden;
			box-sizing: border-box;
		}
		#bar-fill {
			position: absolute;
			left: 0;
			top: 0;
			bottom: 0;
			width: 6%;
			background: linear-gradient(180deg, #ffee6a 0%, #ffc61a 55%, #ff9b00 100%);
			border-radius: 999px;
			transition: width 0.16s ease-out;
		}
		#bar-fill::after {
			content: "";
			position: absolute;
			left: 10px;
			right: 10px;
			top: 4px;
			height: 30%;
			border-radius: 999px;
			background: rgba(255, 255, 232, 0.58);
		}
		#status-text {
			position: relative;
			z-index: 2;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 20px;
			font-weight: 800;
			color: #3d2004;
			text-shadow: 0 1px 0 rgba(255, 246, 180, 0.85);
			letter-spacing: 1px;
		}
		#status-notice {
			display: none;
			position: fixed;
			left: 8%;
			right: 8%;
			bottom: 22%;
			padding: 12px 16px;
			border-radius: 16px;
			background: rgba(120, 28, 28, 0.92);
			border: 2px solid rgba(255, 160, 145, 0.85);
			color: #fff0ee;
			font-size: 14px;
			line-height: 1.5;
			word-break: break-word;
			text-align: center;
			z-index: 20;
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">您的浏览器不支持 WebGL2 Canvas。</canvas>
	<div id="status">
		<img id="splash-logo" src="title_logo.png" alt="来割草 不烧心">
		<div id="load-slot">
			<div class="bar-shell">
				<div id="bar-fill"></div>
				<div id="status-text">0%</div>
			</div>
		</div>
		<div id="status-notice"></div>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
	(function () {
		const GODOT_CONFIG = $GODOT_CONFIG;
		const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
		const statusOverlay = document.getElementById('status');
		const barFill = document.getElementById('bar-fill');
		const statusText = document.getElementById('status-text');
		const statusNotice = document.getElementById('status-notice');

		function showError(msg) {
			statusNotice.style.display = 'block';
			statusNotice.textContent = String(msg);
			statusText.textContent = '!';
		}

		window.addEventListener('error', function (e) {
			showError('JS Error: ' + (e.message || e.error));
		});
		window.addEventListener('unhandledrejection', function (e) {
			showError('Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
		});

		const engine = new Engine(GODOT_CONFIG);
		const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length !== 0) {
			showError('浏览器缺少运行所需特性：\n' + missing.join('\n'));
			return;
		}

		engine.startGame({
			onProgress: function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					barFill.style.width = Math.max(8, pct) + '%';
					statusText.textContent = pct + '%';
				}
			}
		}).then(function () {
			barFill.style.width = '100%';
			statusText.textContent = '100%';
			// Wait 2 animation frames so Godot's matching start screen renders before seamless cross-fade!
			requestAnimationFrame(function () {
				requestAnimationFrame(function () {
					statusOverlay.classList.add('fade-out');
					setTimeout(function () {
						statusOverlay.remove();
					}, 320);
				});
			});
		}).catch(function (err) {
			showError(err && err.message ? err.message : err);
		});
	}());
	</script>
</body>
</html>
